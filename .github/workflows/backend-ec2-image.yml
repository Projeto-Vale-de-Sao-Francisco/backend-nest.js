name: Backend EC2 build validation

on:
  push:
    branches: [feat/backend-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sivale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sivale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/sivale
      JWT_SECRET: ci-only-not-a-production-secret
      # Unit tests exercise this source through mocks; smoke disables sources.
      MERCADO_FONTES_ATIVAS: comexstat
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Clean dependency installation
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client (no migrations)
        working-directory: backend
        run: npx --no-install prisma generate
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: API contract tests
        working-directory: backend
        run: npm run test:e2e
      - name: NestJS build
        working-directory: backend
        run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Nome e versão
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build Linux amd64 (sem segredos)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.ec2
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-ec2
          cache-to: type=gha,mode=max,scope=backend-ec2
      - name: Smoke test isolado (nenhum acesso ao Aiven)
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          docker network create --internal sivale-test
          # Credenciais fictícias, exclusivas do banco descartável deste job.
          docker run -d --name test-db --network sivale-test \
            -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=sivale postgres:17-alpine
          for attempt in {1..60}; do
            if docker exec test-db pg_isready -U postgres -d sivale; then break; fi
            sleep 2
          done
          docker exec test-db pg_isready -U postgres -d sivale
          docker run -d --name test-backend --network sivale-test --network-alias backend \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e DATABASE_URL=postgresql://postgres:ci-only@test-db:5432/sivale \
            -e JWT_SECRET=ci-only-not-a-production-secret -e MERCADO_FONTES_ATIVAS= "$IMAGE"
          for attempt in {1..45}; do
            test "$(docker inspect --format '{{.State.Running}}' test-backend)" = true
            state=$(docker inspect --format '{{.State.Health.Status}}' test-backend)
            if [ "$state" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' test-backend)" = healthy
          # Outro container resolve o mesmo alias/porta que o Caddy usa.
          docker run --rm --network sivale-test --entrypoint node "$IMAGE" \
            -e "fetch('http://backend:3000/auth/me').then(r=>{if(r.status !== 401)process.exit(1)}).catch(()=>process.exit(1))"
          docker run --rm --network none --entrypoint node "$IMAGE" \
            -e "import('bcrypt').then(async b=>{const h=await b.hash('ci-only',4);if(!await b.compare('ci-only',h))process.exit(1)})"
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs test-backend 2>&1 || true
          docker logs test-db 2>&1 || true
      - name: Limpar recursos de teste
        if: always()
        run: |
          docker rm -f test-backend test-db || true
          docker network rm sivale-test || true
